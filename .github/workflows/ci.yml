name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate SQL manifest
        run: npm test

      - name: Validate fixtures
        run: node --test fixtures/v1/test/validate-fixtures.test.mjs

      - name: Restore .NET dependencies
        run: dotnet restore SqlSimCity.slnx --locked-mode

      - name: Test .NET
        run: dotnet test SqlSimCity.slnx --configuration Release --no-restore

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Test web
        working-directory: web
        run: npm test

      - name: Type-check web
        working-directory: web
        run: npm run typecheck

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Publish release
        run: >-
          dotnet publish src/SqlSimCity.Api/SqlSimCity.Api.csproj
          --configuration Release
          --no-restore
          --output artifacts/publish
          -p:ContinuousIntegrationBuild=true
          -p:Deterministic=true
          -p:UseAppHost=false

      - name: Verify published legal notices
        run: |
          cmp LICENSE artifacts/publish/legal/LICENSE
          cmp NOTICE artifacts/publish/legal/NOTICE

      - name: Test operational scripts
        run: tools/tests/operations.test.sh

  container:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build fixture image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          load: true
          push: false
          tags: sqlsimcity-ci:${{ github.sha }}
          build-args: |
            BUILD_DATE=1970-01-01T00:00:00Z
            VERSION=ci-${{ github.sha }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=sqlsimcity-ci
          cache-to: type=gha,mode=max,scope=sqlsimcity-ci

      - name: Smoke fixture and fail-closed modes
        run: tools/container-smoke.sh "sqlsimcity-ci:${GITHUB_SHA}"
