# SQLSimCity edge connector example deployment.
#
# This is a SEPARATE example compose file (use `docker compose -f compose.edge.yaml ...`).
# It shows the central server with opt-in edge ingestion enabled, plus one outward-only edge
# connector that runs near a SQL Server the central container cannot reach. The connector connects
# OUTWARD to the central ingestion endpoint over HTTPS/HMAC and never accepts inbound control.
#
# Never commit real secrets. The files referenced under `secrets:` must be provided out of band and
# excluded from version control. See docs/edge-connector.md for key generation, rotation, TLS,
# reverse-proxy/AllowedHosts, the connector allowlist, and the spool-backup non-guarantee.

services:
  # --- Central SQLSimCity with edge ingestion turned on (disabled by default otherwise). ---
  sqlsimcity-central:
    image: sqlsimcity:local
    build:
      context: .
      args:
        VERSION: 0.0.0-local
        REVISION: local
    # In a real deployment, terminate TLS at a reverse proxy in front of this and set AllowedHosts.
    ports:
      - "127.0.0.1:${SQLSIMCITY_EDGE_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - sqlsimcity-central-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Acquisition__Mode: Edge
      Acquisition__Edge__TargetId: sql-prod-east
      Acquisition__Edge__StaleAfterSeconds: "90"
      Acquisition__Edge__DisconnectAfterSeconds: "300"
      Atlas__Mode: Fixture
      # Opt-in edge ingestion. When disabled (default) the app is strictly GET-only.
      EdgeIngestion__Enabled: "true"
      EdgeIngestion__SecretCatalogFile: /run/secrets/edge-connector-catalog
      EdgeIngestion__SecretsDirectory: /run/secrets
      # The image owns /data as its non-root uid; this journal survives restarts on the named volume.
      EdgeIngestion__NonceJournalPath: /data/edge-nonces.log
      EdgeIngestion__ClockSkewSeconds: "300"
      EdgeIngestion__MaxBatchBytes: "4194304"
      EdgeIngestion__RateLimitPermitPerMinute: "120"
      # Aggregate residency bounds. The 32 MiB section cap is per section group, so these bound the
      # total a connector can hold buffered centrally. 160 MiB is five sections at that cap, so a
      # legitimate connector is never rejected by them. Exceeding one is a 422, never a silent drop.
      EdgeIngestion__MaxPendingBytesPerTarget: "167772160"
      EdgeIngestion__MaxPendingBytesTotal: "335544320"
      EdgeIngestion__MaxPendingGroupsPerTarget: "64"
      EdgeIngestion__MaxTargets: "64"
    secrets:
      - edge-connector-catalog
      - edge-a-hmac
    restart: unless-stopped

  # --- Outward-only edge connector. Runs nonroot, read-only root, all caps dropped, no Docker socket. ---
  sqlsimcity-edge-connector:
    image: sqlsimcity-edge:local
    build:
      context: .
      dockerfile: Dockerfile.connector
      args:
        VERSION: 0.0.0-local
        REVISION: local
    read_only: true
    # The local example shares the central container's network namespace. This makes 127.0.0.1
    # genuinely loopback while keeping production deployments HTTPS-only.
    network_mode: "service:sqlsimcity-central"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    volumes:
      # Bounded encrypted spool. Its contents are AES-256-GCM sealed; the key lives in a separate
      # mounted secret. Backing up the spool is not a delivery guarantee (see docs).
      - sqlsimcity-edge-spool:/spool
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SQLSIMCITY_EDGE_CONNECTOR_ID: edge-a
      SQLSIMCITY_EDGE_TARGET_ID: sql-prod-east
      SQLSIMCITY_EDGE_KEY_ID: "2026-08"
      # Fixture is the runnable no-SQL local smoke. Set Connected only with the complete SQL_
      # profile and mounted authentication files documented in docs/edge-connector.md.
      SQLSIMCITY_EDGE_SOURCE_MODE: Fixture
      # HTTPS remains required in production. Plain HTTP is allowed here only because the connector
      # shares the central service namespace and 127.0.0.1 is therefore true loopback.
      SQLSIMCITY_EDGE_INGEST_ENDPOINT: http://127.0.0.1:8080/api/v1/edge/ingest
      SQLSIMCITY_EDGE_ALLOW_LOOPBACK_HTTP: "true"
      SQLSIMCITY_EDGE_SIGNING_SECRET_FILE: /run/secrets/edge-a-hmac
      SQLSIMCITY_EDGE_SPOOL_KEY_FILE: /run/secrets/edge-spool-key
      SQLSIMCITY_EDGE_SPOOL_DIR: /spool
      SQLSIMCITY_EDGE_FIXTURES_DIR: /app/fixtures/v1
      SQLSIMCITY_EDGE_COLLECT_INTERVAL_SECONDS: "15"
      # Ceiling on the decayed collection cadence while the spool is rejecting batches, so a long
      # outage stops re-querying SQL Server every cycle for evidence that cannot be stored.
      SQLSIMCITY_EDGE_COLLECT_MAX_BACKOFF_SECONDS: "300"
      SQLSIMCITY_EDGE_DELIVER_INTERVAL_SECONDS: "5"
      SQLSIMCITY_EDGE_SPOOL_MAX_BYTES: "67108864"
      SQLSIMCITY_EDGE_SPOOL_MAX_ITEMS: "4096"
      SQLSIMCITY_EDGE_SPOOL_MAX_AGE_SECONDS: "86400"
      # Optional loopback-only generic health port; 0 disables it. There is no inbound control API.
      SQLSIMCITY_EDGE_LOOPBACK_HEALTH_PORT: "0"
    secrets:
      - edge-a-hmac
      - edge-spool-key
    depends_on:
      sqlsimcity-central:
        condition: service_started
        restart: true
    restart: unless-stopped

volumes:
  sqlsimcity-central-data:
  sqlsimcity-edge-spool:

# Provide these files out of band; do NOT commit them.
#   edge-connector-catalog: JSON allowlist mapping connector ids -> key ids -> secret file names
#                           (see docs/edge-connector.md). References edge-a-hmac by file name.
#   edge-a-hmac:            base64 of >= 32 random bytes; the shared HMAC secret for connector edge-a.
#   edge-spool-key:         JSON spool key file { "formatVersion":1, "keyVersion":1, "key":"<base64 32 bytes>" }.
secrets:
  edge-connector-catalog:
    file: ./secrets/edge-connector-catalog.json
  edge-a-hmac:
    file: ./secrets/edge-a-hmac.b64
  edge-spool-key:
    file: ./secrets/edge-spool-key.json
